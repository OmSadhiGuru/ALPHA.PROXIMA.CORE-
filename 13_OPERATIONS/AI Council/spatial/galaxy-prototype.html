<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alpha Proxima — Council Virtual Brain</title>
<style>
  :root{color-scheme:dark;--ink:#eef1f6;--muted:#93a2b8;--line:#232e42;--panel:#0c1220;
        --bg-top:#050810;--bg-bottom:#0a1330;--gold:#ffe1a8;--accent:#8fb3ff;--brain:#a48bff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 20%, var(--bg-bottom), var(--bg-top));
            color:var(--ink);font:14px/1.4 system-ui,-apple-system,sans-serif;overflow:hidden}
  #scene{position:fixed;inset:0}
  #hud{position:fixed;inset:0;pointer-events:none}
  .label{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;
         background:rgba(8,12,22,.82);border:1px solid var(--line);border-radius:8px;
         padding:3px 9px;font-size:11px;white-space:nowrap;align-items:center;gap:6px;
         cursor:pointer;display:none}
  .label.shown{display:flex}
  .label.dim{pointer-events:none;opacity:.55}
  .label .dot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--muted)}
  .label.available .dot{background:#6ee7b7}
  .label.executing .dot{background:#ff9d6e}
  .label.busy .dot{background:#ffcf6e}
  .label.vault .dot{background:var(--brain)}
  .label.proposed{border-style:dashed;color:var(--muted)}
  .label.lumiaion{border-color:var(--gold);color:var(--gold);font-weight:700;font-size:13px;
                  box-shadow:0 0 22px -6px var(--gold)}
  .label.vault{border-color:var(--brain);color:var(--brain);font-weight:600;font-size:11px;
               box-shadow:0 0 18px -6px var(--brain)}
  #panel .brain-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:10px 0}
  #panel .brain-stats div{font-size:12px}
  #panel .brain-stats b{display:block;font-size:17px;color:var(--brain)}

  /* The thought trail. Deliberately a thin strip at the bottom: the Founder
     must be able to see where a path has led without the path competing with
     the scene it describes. */
  #thoughtTrail{position:fixed;left:0;right:0;bottom:0;padding:8px 14px;display:none;gap:6px;
                align-items:center;flex-wrap:wrap;pointer-events:auto;z-index:3;
                background:linear-gradient(to top,rgba(5,8,16,.92),rgba(5,8,16,0));font-size:11px}
  #thoughtTrail.shown{display:flex}
  #thoughtTrail .step{background:rgba(12,18,32,.9);border:1px solid var(--line);color:var(--ink);
                      border-radius:999px;padding:3px 10px;font:inherit;cursor:pointer;white-space:nowrap}
  #thoughtTrail .step.here{border-color:var(--gold);color:var(--gold)}
  #thoughtTrail .step:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #thoughtTrail .sep{color:var(--muted);opacity:.7}
  #thoughtTrail .kind{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;
                      margin-right:4px}

  /* Edge legend. An inferred line that looked like a canonical one would be the
     worst failure in this view, so the difference is stated, not just drawn. */
  #edgeLegend{position:fixed;left:14px;bottom:44px;font-size:10px;color:var(--muted);
              pointer-events:none;z-index:2;line-height:1.7}
  #edgeLegend b{color:var(--ink);font-weight:600;display:block;margin-bottom:3px;
                text-transform:uppercase;letter-spacing:.08em}
  #edgeLegend i{display:inline-block;width:18px;height:0;border-top-width:2px;margin-right:6px;
                vertical-align:middle}

  /* Degraded state, stated rather than implied by an empty feed. */
  #liveBanner{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:4;display:none;
              background:rgba(12,18,32,.94);border:1px solid var(--line);border-radius:8px;
              padding:6px 12px;font-size:11px;color:var(--muted);max-width:88vw}
  #liveBanner.shown{display:block}
  #liveBanner.degraded{border-color:#ffcf6e;color:#ffcf6e}
  .label.presence-stale{opacity:.45}
  .label .pulse{width:6px;height:6px;border-radius:50%;flex:none;background:var(--gold);
                margin-left:2px}
  /* Memory nodes read as a different substance from Council seats: the Council
     is who exists, memory is what happened. Cooler, quieter, monospaced. */
  .label.memory{border-color:#3a4a6a;color:#9fb4d8;font-family:ui-monospace,SFMono-Regular,monospace;
                font-size:10px}
  .label.memory .dot{background:#6ea8ff}
  .label.memory.attention{border-color:#ff9d6e;color:#ffbb96}
  .label.memory.attention .dot{background:#ff9d6e}
  .label.actor{border-style:dotted;color:#8fa0c0;font-size:10px}
  #panel .timeline{margin:8px 0;border-left:2px solid var(--line);padding-left:10px}
  #panel .timeline div{font-size:11px;color:var(--muted);margin:5px 0}
  #panel .timeline b{color:var(--ink);font-weight:600;display:block;font-size:12px}
  #panel .unresolved{border:1px dashed #4a5878;border-radius:6px;padding:8px;margin:8px 0;
                     font-size:11px;color:var(--muted)}

  header{position:fixed;top:0;left:0;right:0;padding:14px 18px;display:flex;justify-content:space-between;
         align-items:flex-start;pointer-events:none;z-index:2}
  header h1{font-size:14px;margin:0 0 4px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
  #breadcrumb{pointer-events:auto;font-size:12px;color:var(--muted)}
  #breadcrumb button{background:none;border:none;color:var(--accent);font:inherit;cursor:pointer;padding:0}
  #breadcrumb button:focus-visible, .label:focus-visible, #search:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #backBtn,#sessionsBtn,#brainBtn,#consoleBtn{pointer-events:auto;background:rgba(12,18,32,.85);border:1px solid var(--line);color:var(--ink);
           border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}
  #backBtn{display:none}
  #backBtn.shown{display:inline-block}
  .session-card{background:#141d30;border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0}
  .session-card .meta{color:var(--muted);font-size:11px}
  .session-card .run{border-top:1px solid var(--line);padding-top:6px;margin-top:6px;font-size:12px}
  .session-card .run + .run{margin-top:6px}
  .badge.state{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;text-transform:uppercase;
               background:rgba(143,179,255,.15);color:var(--accent)}
  #search{pointer-events:auto;background:rgba(12,18,32,.85);border:1px solid var(--line);color:var(--ink);
          border-radius:8px;padding:6px 10px;font-size:12px;width:220px}
  #searchResults{pointer-events:auto;position:absolute;top:32px;right:0;background:var(--panel);
                border:1px solid var(--line);border-radius:8px;width:240px;max-height:220px;overflow:auto;display:none}
  #searchResults.shown{display:block}
  #searchResults div{padding:6px 10px;font-size:12px;cursor:pointer;border-bottom:1px solid var(--line)}
  #searchResults div:hover, #searchResults div:focus-visible{background:#182236}
  #navHint{position:fixed;left:18px;bottom:22px;color:var(--muted);font-size:11px;letter-spacing:.02em;pointer-events:none;z-index:2}

  #panel{position:fixed;top:0;right:0;bottom:0;width:360px;max-width:92vw;background:var(--panel);
         border-left:1px solid var(--line);padding:20px;overflow:auto;transform:translateX(100%);
         transition:transform .2s ease;z-index:3}
  #panel.open{transform:translateX(0)}
  #panel h2{margin:0 0 2px;font-size:16px}
  #panel .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
  #panel .field{margin:10px 0}
  #panel .field b{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
  #panel .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;text-transform:uppercase}
  #panel .badge.available{background:rgba(110,231,183,.15);color:#6ee7b7}
  #panel .badge.blocked{background:rgba(147,162,184,.2);color:var(--muted)}
  #panel .badge.advisory-only{background:rgba(255,207,110,.15);color:#ffcf6e}
  #panel .cmd{background:#04070d;border:1px solid var(--line);border-radius:8px;padding:10px;
              font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;user-select:all}
  #panel button.copy{margin-top:8px;background:var(--panel);border:1px solid var(--line);color:var(--ink);
                      border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer}
  #panel .close{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
  #panel textarea{width:100%;min-height:70px;background:#04070d;border:1px solid var(--line);border-radius:8px;
                  color:var(--ink);font:inherit;padding:8px;resize:vertical}
  #panel button.primary{margin-top:8px;background:var(--gold);border:none;color:#1a1400;font-weight:600;
                        border-radius:6px;padding:7px 14px;font-size:12px;cursor:pointer}
  #panel .demo-flag{background:rgba(255,159,110,.15);color:#ff9d6e;border-radius:8px;padding:8px 10px;
                     font-size:11px;margin:10px 0}
  #panel .satellites{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  #panel .satellite{background:#141d30;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:11px}
  #panel .brain-category,#panel .node-card{width:100%;text-align:left;background:#111a2b;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px;margin:6px 0;cursor:pointer}
  #panel .brain-category b,#panel .node-card b{display:block;font-size:13px}
  #panel .node-card small{color:var(--muted);display:block;margin-top:3px}
  #panel .source-link{display:inline-block;color:var(--accent);cursor:pointer;background:transparent;border:0;padding:0;text-align:left;font:inherit;text-decoration:underline}

  #fallback{display:none;position:fixed;inset:0;overflow:auto;padding:24px;background:var(--bg-top)}
  #fallback.shown{display:block}
  #fallback h2{color:var(--gold)}
  #fallback ul{list-style:none;padding-left:16px}
  #fallback li{margin:4px 0}
  #fallback button{background:#141d30;border:1px solid var(--line);color:var(--ink);border-radius:6px;
                   padding:4px 10px;font:inherit;cursor:pointer}

  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
  a{color:var(--accent)}

  button,input,a{min-height:44px}input,textarea{font-size:16px!important}#panel{padding-top:64px;overflow-wrap:anywhere}#panel .close{min-width:44px;min-height:44px}.label{min-height:44px}#searchResults{top:52px;max-height:45vh}#searchResults div{padding:14px}#officeLink{display:none}
  @media(max-width:650px){header{padding:12px;display:block}header h1{font-size:12px}header p{font-size:11px;margin:4px 0 8px;max-width:36ch}header>div:last-child{flex-wrap:wrap!important;margin-top:8px}#search{width:min(190px,55vw)}#panel{width:100%;max-width:100%;top:140px;border-radius:20px 20px 0 0;padding:54px 20px 24px}.label{font-size:10px;padding:6px;max-width:155px;white-space:normal;text-align:center}.label.lumiaion{font-size:11px}#fallback{padding-top:190px}.sr-only:focus-within{position:fixed;top:180px;left:12px;width:calc(100% - 24px);height:auto;max-height:45vh;overflow:auto;clip:auto;background:#0c1220;z-index:5}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="scene"></div>
<div id="hud"></div>
<div id="navHint">Drag to move through the constellation · pinch or scroll to approach · tap a node to enter</div>
<div id="fallback" role="region" aria-label="Council structure (no WebGL)"></div>

<header>
  <div>
    <h1>Alpha Proxima · Council Virtual Brain</h1>
    <p>Enter the living memory field. Explore the Council, its knowledge nodes, and the paths that connect them.</p>
    <nav id="breadcrumb" aria-label="Breadcrumb"></nav>
  </div>
  <div style="position:relative;pointer-events:auto;display:flex;gap:8px;align-items:center">
    <a id="officeLink" href="#" style="color:var(--accent);font-size:12px">← Council 3D Office</a>
    <button id="brainBtn">Memory Brain</button>
    <button id="consoleBtn">Operations</button>
    <button id="sessionsBtn">Council Sessions</button>
    <button id="backBtn">← Back to Council</button>
    <input id="search" type="text" placeholder="Search name, role, or skill…" aria-label="Search roles" autocomplete="off">
    <div id="searchResults" role="listbox"></div>
  </div>
</header>

<!-- Keyboard/screen-reader parity: every seat is also a real, focusable button here. -->
<nav id="a11yList" class="sr-only" aria-label="Council roles (keyboard list)"></nav>

<div id="liveBanner" role="status"></div>

<!-- The reversible thought path. Buttons, not decoration: every step the
     Founder has walked through is focusable and returns there. -->
<nav id="thoughtTrail" aria-label="Thought path"></nav>

<div id="edgeLegend" aria-hidden="true"></div>

<aside id="panel" role="dialog" aria-label="Details">
  <button class="close" onclick="closePanel()" aria-label="Close">✕</button>
  <div id="panelBody"></div>
</aside>

  //     to refuse to re-animate it;
  //   * when the transport is not live, the banner says so, because a feed that
  //     has simply stopped moving is indistinguishable from one with nothing
  //     to show.
  const WORKING_STATES = ['thinking', 'researching', 'coding', 'indexing'];
  let live = VIEW.live || { available: false, presence: [], activity: [], badge: 0,
                            realtime: { mode: 'unavailable', detail: 'No live data in this render.' } };
  const pulseFor = {};   // node_id -> the dot element to animate

  function renderLiveBanner() {
    const banner = document.getElementById('liveBanner');
    const realtime = live.realtime || {};
    if (realtime.mode === 'live') { banner.classList.remove('shown'); return; }
    // Everything except `live` is worth saying out loud.
    const badge = live.badge ? ' · ' + live.badge + ' awaiting the Founder' : '';
    banner.textContent = (realtime.detail || 'Live state unknown.') + badge;
    banner.classList.add('shown');
    banner.classList.toggle('degraded', realtime.mode === 'stale' || realtime.mode === 'unavailable');
  }

  // A node reports itself by the name it knows — "CODEX", or a registry role
  // title — while the scene draws registry ids. Resolving both here means an
  // agent never has to learn an id to be visible, and a presence report keyed
  // either way lands on the right seat.
  function presenceFor(nodeId) {
    const rows = live.presence || [];
    const desk = findDesk(nodeId);
    const name = desk ? desk.named_role : null;
    return rows.find(row => row.node_id === nodeId) ||
           (name ? rows.find(row => row.node_id === name) : null) || null;
  }

  function applyPresence() {
    labels.forEach(l => {
      if (!l.id) return;
      const row = presenceFor(l.id);
      // `stale` comes from the read model, which already expired the record.
      // The scene never computes TTL arithmetic itself and gets it wrong.
      l.el.classList.toggle('presence-stale', !!(row && row.stale));
      const working = row && !row.stale && WORKING_STATES.indexOf(row.state) >= 0;
      if (working && !pulseFor[l.id]) {
        const dot = document.createElement('span');
        dot.className = 'pulse';
        l.el.appendChild(dot);
        pulseFor[l.id] = dot;
      } else if (!working && pulseFor[l.id]) {
        pulseFor[l.id].style.display = 'none';
        delete pulseFor[l.id];
      }
    });
  }

  function latestEventFor(nodeId) {
    const desk = findDesk(nodeId);
    const name = desk ? desk.named_role : nodeId;
    return (live.activity || []).find(row => row.actor === nodeId || row.actor === name) || null;
  }


  // ---------------------------------------------------------------------
  // labels (HTML overlay, progressive disclosure by current view)
  // ---------------------------------------------------------------------
  const labels = []; // { el, pos, id, tier }
  function addLabel(id, pos, text, cls, tier) {
    const el = document.createElement('div');
    el.className = 'label ' + (cls || '');
    const dot = document.createElement('span'); dot.className = 'dot';
    el.appendChild(dot);
    el.appendChild(document.createTextNode(text));
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.onclick = () => id && selectRole(id);
    el.onkeydown = (e) => { if ((e.key === 'Enter' || e.key === ' ') && id) { e.preventDefault(); selectRole(id); } };
    document.getElementById('hud').appendChild(el);
    labels.push({ el, pos, id, tier });
    return el;
  }
  const lumiaionLabel = addLabel('AGT-001', positions['AGT-001'].clone().add(new THREE.Vector3(0, 1.1, 0)),
    galaxy.center.named_role, 'lumiaion', 'overview');
  lumiaionLabel.onclick = () => openLumiaionDialogue();

  const vaultLabel = addLabel(null, vaultPos.clone().add(new THREE.Vector3(0, 0.8, 0)),
    'ALPHA PROXIMA VAULT', 'vault', 'overview');
  vaultLabel.onclick = () => openVaultPanel();

  // Per the brief: the overview shows only LUMIAION and department names.
  // Everything else (inner-circle seats, constellation members, the
  // unassigned holding cluster) reveals its label on hover/focus, so the
  // scene stays legible at rest instead of a crown of overlapping boxes.
  galaxy.inner_circle.forEach(seat => {
    if (seat.proposed) {
      addLabel(null, seat.__pos.clone().add(new THREE.Vector3(0, 0.4, 0)), seat.function, 'proposed', 'hover');
    } else {
      addLabel(seat.desk.id, positions[seat.desk.id].clone().add(new THREE.Vector3(0, 0.4, 0)),
        seat.desk.named_role, statusClass(seat.desk), 'hover');
    }
  });

  galaxy.council.forEach(c => {
    addLabel(c.lead.id, positions[c.lead.id].clone().add(new THREE.Vector3(0, 0.5, 0)),
      c.owner, statusClass(c.lead), 'overview');
    c.constellation.forEach(m => {
      addLabel(m.id, positions[m.id].clone().add(new THREE.Vector3(0, 0.35, 0)),
        m.named_role, statusClass(m) + ' dim', 'department:' + c.owner);
    });
  });

  galaxy.unassigned.forEach(u => {
    addLabel(u.id, positions[u.id].clone().add(new THREE.Vector3(0, 0.35, 0)), u.named_role, 'proposed', 'hover');
  });

  function statusClass(desk) {
    const a = desk.active_assignment;
    if (a && a.status === 'executing') return 'executing';
    if (a) return 'busy';
    if (desk.state === 'available') return 'available';
    return 'proposed';
  }

  function project(vec3) {
    const p = vec3.clone().project(camera);
    return { x: (p.x * 0.5 + 0.5) * window.innerWidth, y: (-p.y * 0.5 + 0.5) * window.innerHeight,
             behind: p.z > 1 };
  }

  // ---------------------------------------------------------------------
  // navigation: overview <-> department <-> agent, with a bounded camera tween
  // ---------------------------------------------------------------------
  let activeDept = null, activeRole = null;
  // `thoughtPath` is declared here rather than beside its own section below:
  // `renderBreadcrumb` runs during setup and reads it, and a `let` still in its
  // temporal dead zone would throw instead of reading as empty.
  let thoughtPath = [];
  const breadcrumbEl = document.getElementById('breadcrumb');
  const backBtn = document.getElementById('backBtn');

  function renderBreadcrumb() {
    // `pushThought` may not exist yet on the very first call during setup; the
    // trail renders itself once a step is actually taken.
    let html = '<button onclick="window.goToOverview()">Council</button>';
    if (activeDept) html += ' / <button onclick="window.goToDept(\'' + activeDept + '\')">' + activeDept + '</button>';
    if (activeRole) {
      const desk = findDesk(activeRole);
      if (desk) html += ' / ' + desk.named_role;
    }
    breadcrumbEl.innerHTML = html;
    // Back is offered whenever there is somewhere to go back *to*, which is a
    // property of the thought path, not of the department currently open.
    backBtn.classList.toggle('shown', thoughtPath.length > 0 || !!activeDept);
  }

  function findDesk(id) {
    if (galaxy.center.id === id) return galaxy.center;
    for (const s of galaxy.inner_circle) if (s.desk && s.desk.id === id) return s.desk;
    for (const c of galaxy.council) {
      if (c.lead.id === id) return c.lead;
      for (const m of c.constellation) if (m.id === id) return m;
    }
    for (const u of galaxy.unassigned) if (u.id === id) return u;
    return null;
  }
  function findDept(id) {
    return galaxy.council.find(c => c.lead.id === id || c.constellation.some(m => m.id === id));
  }

  let tweenStart = null, tweenFrom = null, tweenTo = null, tweenDuration = 700;
  function tweenTo_(view) {
    if (REDUCED_MOTION) { camState = Object.assign({}, view); applyCamera(); return; }
    tweenFrom = Object.assign({}, camState);
    tweenTo = Object.assign({}, view);
    tweenStart = performance.now();
  }

  window.goToOverview = () => {
    activeDept = null; activeRole = null;
    tweenTo_(VIEWS.overview);
    applyFocus(null);   // the whole scene comes back to full weight
    // The overview is not a step on a path; it is where a path ends. Leaving a
    // trail visible here would offer a route the Founder has already left.
    thoughtPath = [];
    renderTrail();
    renderBreadcrumb();
    updateLabelVisibility();
    closePanel();
  };
  window.goToDept = (owner) => {
    const c = galaxy.council.find(x => x.owner === owner);
    if (!c) return;
    activeDept = owner; activeRole = null;
    const target = positions[c.lead.id].clone();
    tweenTo_({ target, dist: 9, elevation: 0.7, azimuth: c.__angle });
    pushThought('department', owner);
    renderBreadcrumb();
    updateLabelVisibility();
  };
  // ---------------------------------------------------------------------
  // thought navigation
  // ---------------------------------------------------------------------
  // `thoughtPath` is the Founder's route through the Foundation's
  // relationships, and it is reversible. The three rules:
  //
  //   * selecting a node not on the path appends it;
  //   * selecting a node already on the path truncates back to it, so
  //     revisiting is going back rather than looping forward;
  //   * every step stays focusable, so the whole route is navigable by
  //     keyboard, not only by clicking in the scene.
  //
  // Nothing here is stored. A thought path is a reading position, not a record.
  // (`thoughtPath` itself is declared above, where the breadcrumb first reads it.)
  const trailEl = document.getElementById('thoughtTrail');

  function labelForStep(step) {
    if (step.kind === 'memory') return nodeLabel(step.id);
    if (step.kind === 'vault') return 'Vault';
    if (step.kind === 'department') return step.id;
    if (step.kind === 'sessions') return 'Sessions';
    const desk = findDesk(step.id);
    return desk ? desk.named_role : step.id;
  }

  function pushThought(kind, id) {
    const existing = thoughtPath.findIndex(step => step.kind === kind && step.id === id);
    if (existing >= 0) {
      // Already walked. Truncate rather than append: the path is a route, and a
      // route that revisits a node has come back to it.
      thoughtPath = thoughtPath.slice(0, existing + 1);
    } else {
      thoughtPath.push({ kind, id });
    }
    renderTrail();
  }

  function renderTrail() {
    if (!thoughtPath.length) { trailEl.classList.remove('shown'); trailEl.innerHTML = ''; return; }
    const parts = ['<span class="kind">thought path</span>'];
    thoughtPath.forEach((step, index) => {
      if (index) parts.push('<span class="sep">→</span>');
      const here = index === thoughtPath.length - 1 ? ' here' : '';
      parts.push('<button class="step' + here + '" data-index="' + index + '">' +
                 labelForStep(step) + '</button>');
    });
    parts.push('<span class="sep">·</span><button class="step" data-index="-1">clear</button>');
    trailEl.innerHTML = parts.join('');
    trailEl.classList.add('shown');
    trailEl.querySelectorAll('button').forEach(button => {
      button.onclick = () => {
        const index = Number(button.dataset.index);
        if (index < 0) { thoughtPath = []; renderTrail(); window.goToOverview(); return; }
        // Truncate to the chosen step, then re-enter it. Re-entering is what
        // moves the camera and reopens the panel, so going back feels the same
        // as going forward.
        const step = thoughtPath[index];
        thoughtPath = thoughtPath.slice(0, index);
        enterStep(step);
      };
    });
  }

  function enterStep(step) {
    if (step.kind === 'memory') { selectMemoryNode(step.id); return; }
    if (step.kind === 'department') { window.goToDept(step.id); return; }
    if (step.kind === 'vault') { openVaultPanel(); return; }
    if (step.kind === 'sessions') { openSessionsPanel(); return; }
    selectRole(step.id);
  }

  window.stepBack = () => {
    if (thoughtPath.length > 1) {
      thoughtPath.pop();
      const previous = thoughtPath.pop();
      enterStep(previous);
      return;
    }
    thoughtPath = [];
    renderTrail();
    window.goToOverview();
  };

  // ---------------------------------------------------------------------
  // immersive focus
  // ---------------------------------------------------------------------
  // Entering a node should feel like entering a thought, so the scene responds
  // as a whole: the node grows and brightens, unrelated context recedes, and
  // the edges that explain *why* this node matters stay legible. Nothing is
  // hidden — dimmed context keeps the Founder oriented, where culling would
  // make each selection a fresh disorientation.
  const FOCUS_SCALE = 1.7;
  let focusedId = null;

  function connectedEdges(nodeId) {
    return edgeObjects.filter(item => item.edge.source === nodeId || item.edge.target === nodeId);
  }

  function applyFocus(nodeId) {
    focusedId = nodeId;
    Object.keys(meshFor).forEach(id => {
      const mesh = meshFor[id];
      const focused = id === nodeId;
      const scale = focused ? FOCUS_SCALE : 1;
      mesh.scale.setScalar(scale);
      if (mesh.material && 'emissiveIntensity' in mesh.material) {
        if (mesh.userData.baseEmissive === undefined) {
          mesh.userData.baseEmissive = mesh.material.emissiveIntensity;
        }
        const base = mesh.userData.baseEmissive;
        mesh.material.emissiveIntensity = !nodeId ? base : (focused ? base * 2.2 : base * 0.45);
      }
    });
    const related = new Set(connectedEdges(nodeId).map(item => item.mesh.id));
    edgeObjects.forEach(item => {
      const base = item.baseOpacity;
      item.mesh.material.opacity = !nodeId ? base
        : (related.has(item.mesh.id) ? Math.min(1, base * 2.4) : base * 0.3);
    });
  }

  function selectRole(id) {
    if (memoryNodeById[id]) { selectMemoryNode(id); return; }
    activeRole = id;
    const dept = findDept(id);
    if (dept && dept.owner !== activeDept) window.goToDept(dept.owner);
    // Focus on the node itself, not just its department: the camera settles on
    // the seat, and the surrounding context dims rather than disappearing.
    const seat = positions[id];
    if (seat) {
      tweenTo_({ target: seat.clone(), dist: 6.5, elevation: 0.55,
                 azimuth: (dept && dept.__angle !== undefined) ? dept.__angle : camState.azimuth });
    }
    applyFocus(id);
    pushThought('agent', id);
    renderBreadcrumb();
    openPanel(id);
  }
  backBtn.onclick = () => window.stepBack();

  function updateLabelVisibility() {
    labels.forEach(l => {
      const show = l.tier === 'overview' || l.tier === 'department:' + activeDept;
      l.el.classList.toggle('shown', show);
    });
  }
  labelMemoryNodes();
  updateLabelVisibility();

  // The live overlay decorates labels, so it starts only once they exist.
  renderLiveBanner();
  applyPresence();

  // Refresh only when this page is being served — opened from `file://` there is
  // no endpoint to ask, and a failed fetch every fifteen seconds would be noise.
  if (window.location.protocol !== 'file:') {
    setInterval(() => {
      fetch('/api/v1/live' + window.location.search, { cache: 'no-store' })
        .then(response => response.ok ? response.json() : null)
        .then(fresh => {
          if (!fresh) return;
          live = fresh;
          renderLiveBanner();
          applyPresence();
        })
        // A failed refresh leaves the last known state on screen and says so
        // through the banner; it must not blank the scene.
        .catch(() => {
          live = Object.assign({}, live, {
            realtime: { mode: 'stale',
                        detail: 'Lost contact with the live layer; showing the last known state.',
                        canonical_readable: true, presence_trustworthy: false },
          });
          renderLiveBanner();
        });
    }, 15000);
  }

  // ---------------------------------------------------------------------
  // interaction: click a seat mesh, drag to orbit (bounded), wheel zoom (bounded)
  // ---------------------------------------------------------------------
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  renderer.domElement.addEventListener('click', (e) => {
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hit = raycaster.intersectObjects(clickTargets.map(t => t.mesh))[0];
    if (hit) {
      const found = clickTargets.find(t => t.mesh === hit.object);
      if (found) selectRole(found.id);
    }
  });

  let dragging = false, lastX = 0, lastY = 0;
  const pointerScreen = { x: -9999, y: -9999 };
  renderer.domElement.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
  window.addEventListener('mouseup', () => dragging = false);
  window.addEventListener('mousemove', e => {
    pointerScreen.x = e.clientX; pointerScreen.y = e.clientY;
    if (!dragging) return;
    const dx = (e.clientX - lastX) * 0.004;
    const dy = (e.clientY - lastY) * 0.004;
    lastX = e.clientX; lastY = e.clientY;
    camState.azimuth += dx;
    camState.elevation = Math.min(1.75, Math.max(-0.45, camState.elevation - dy));
    applyCamera();
  });
  renderer.domElement.addEventListener('wheel', e => {
    camState.dist = Math.min(40, Math.max(6, camState.dist + e.deltaY * 0.02));
    applyCamera();
  }, { passive: true });

  // Touch: one finger orbits (same math as mouse drag) and also updates
  // pointerScreen so hover-reveal labels work under a finger, since touch
  // has no real hover; two fingers pinch to zoom. Taps still reach the
  // `click` handler above -- browsers synthesize it from a touchend with
  // little movement. `{passive:false}` + preventDefault stops the page
  // itself from scrolling/zooming while a gesture is in progress.
  let pinchStartDist = 0, pinchStartCamDist = camState.dist;
  function touchDist(touches) {
    return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
  }
  renderer.domElement.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
      pointerScreen.x = e.touches[0].clientX; pointerScreen.y = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      dragging = false;
      pinchStartDist = touchDist(e.touches);
      pinchStartCamDist = camState.dist;
    }
  }, { passive: true });
  renderer.domElement.addEventListener('touchmove', e => {
    if (e.touches.length === 1 && dragging) {
      e.preventDefault();
      const t = e.touches[0];
      pointerScreen.x = t.clientX; pointerScreen.y = t.clientY;
      const dx = (t.clientX - lastX) * 0.004;
      const dy = (t.clientY - lastY) * 0.004;
      lastX = t.clientX; lastY = t.clientY;
      camState.azimuth += dx;
      camState.elevation = Math.min(1.75, Math.max(-0.45, camState.elevation - dy));
      applyCamera();
    } else if (e.touches.length === 2) {
      e.preventDefault();
      const dist = touchDist(e.touches);
      if (pinchStartDist > 0) {
        camState.dist = Math.min(40, Math.max(6, pinchStartCamDist * (pinchStartDist / dist)));
        applyCamera();
      }
    }
  }, { passive: false });
  renderer.domElement.addEventListener('touchend', e => {
    if (e.touches.length === 0) dragging = false;
  }, { passive: true });

  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') window.goToOverview();
  });

  window.addEventListener('resize', () => {
    const a = window.innerWidth / window.innerHeight;
    const f = Math.max(15, 24 / a);
    camera.left = -f * a; camera.right = f * a; camera.top = f; camera.bottom = -f;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  (function tick(now) {
    if (!REDUCED_MOTION && window.__vaultCore) {
      window.__vaultCore.rotation.y = now * 0.00012;
      window.__vaultCore.rotation.x = Math.sin(now * 0.00006) * 0.15;
    }
    if (tweenStart !== null) {
      const t = Math.min(1, (now - tweenStart) / tweenDuration);
      const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      camState.target = tweenFrom.target.clone().lerp(tweenTo.target, ease);
      camState.dist = tweenFrom.dist + (tweenTo.dist - tweenFrom.dist) * ease;
      camState.elevation = tweenFrom.elevation + (tweenTo.elevation - tweenFrom.elevation) * ease;
      let da = tweenTo.azimuth - tweenFrom.azimuth;
      da = Math.atan2(Math.sin(da), Math.cos(da));
      camState.azimuth = tweenFrom.azimuth + da * ease;
      applyCamera();
      if (t >= 1) tweenStart = null;
    }
    labels.forEach(l => {
      const p = project(l.pos);
      l.el.style.left = p.x + 'px'; l.el.style.top = p.y + 'px';
      let tierOk = l.tier === 'overview' || l.tier === 'department:' + activeDept;
      if (!tierOk && l.tier === 'hover') {
        const dx = p.x - pointerScreen.x, dy = p.y - pointerScreen.y;
        tierOk = (dx * dx + dy * dy) < 1600; // ~40px reveal radius
      }
      l.el.classList.toggle('shown', tierOk && !p.behind);
    });
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  })(performance.now());

  // ---------------------------------------------------------------------
  // side panel
  // ---------------------------------------------------------------------
  function nextCommandFor(desk) {
    const active = desk.active_assignment;
    if (active) return 'ap.py council run ' + active.session_id + ' ' + active.run_id + ' --prompt "..."';
    return '# no open assignment for this role yet:\nap.py council assign &lt;session_id&gt; ' + desk.id + ' "&lt;deliverable&gt;"';
  }

  function escapeText(value) {
    // The panel builds HTML by concatenation, and event titles come from
    // external systems. Anything from the ledger is escaped before it lands in
    // markup.
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function relativeAge(seconds) {
    if (seconds == null) return 'unknown';
    if (seconds < 60) return seconds + ' seconds ago';
    if (seconds < 3600) return Math.round(seconds / 60) + ' minutes ago';
    if (seconds < 86400) return Math.round(seconds / 3600) + ' hours ago';
    return Math.round(seconds / 86400) + ' days ago';
  }

  function presenceField(nodeId) {
    const row = presenceFor(nodeId);
    if (!row) {
      // No report at all is different from a report saying idle, and the panel
      // says which one this is.
      return '<div class="field"><b>Presence</b>No report. This role has never announced itself.</div>';
    }
    if (row.stale) {
      return '<div class="field"><b>Presence</b>Offline. Last reported <i>' +
             escapeText(row.reported_state) + '</i> ' + relativeAge(row.age_seconds) +
             ' — not current.</div>';
    }
    return '<div class="field"><b>Presence</b>' + escapeText(row.state).toUpperCase() +
           (row.activity ? ' · ' + escapeText(row.activity) : '') +
           ' · ' + relativeAge(row.age_seconds) + '</div>';
  }

  function latestEventField(event) {
    if (!event) return '';
    const link = event.web_link
      ? ' <a href="' + escapeText(event.web_link) + '" style="color:var(--accent)">open</a>' : '';
    return '<div class="field"><b>Latest event</b>' + escapeText(event.title) +
           '<div class="meta" style="color:var(--muted);font-size:11px">' +
           escapeText(event.event_type) + ' · ' + relativeAge(event.age_seconds) +
           (event.requires_founder ? ' · awaiting the Founder' : '') + link + '</div></div>';
  }

  // ---------------------------------------------------------------------
  // a memory node's panel — an entity's whole life, or an actor's reach
  // ---------------------------------------------------------------------
  function selectMemoryNode(id) {
    const node = memoryNodeById[id];
    if (!node) return;
    activeRole = id;
    const at = positions[id];
    if (at) {
      // Approach from outside the ring, so the Council stays behind the node
      // rather than the camera flying through it.
      tweenTo_({ target: at.clone(), dist: 7, elevation: 0.5,
                 azimuth: Math.atan2(at.z, at.x) });
    }
    applyFocus(id);
    pushThought('memory', id);
    renderBreadcrumb();
    openMemoryPanel(node);
  }

  function relatedMemoryEdges(id) {
    return (memory.edges || []).filter(e => e.source === id || e.target === id);
  }

  function nodeLabel(id) {
    if (memoryNodeById[id]) return memoryNodeById[id].label;
    const desk = findDesk(id);
    return desk ? desk.named_role : id;
  }

  function openMemoryPanel(node) {
    const body = document.getElementById('panelBody');
    const related = relatedMemoryEdges(node.id);
    // Every line is labelled with the relationship it represents and the record
    // that supports it, so "why are these connected?" is answerable in the
    // panel rather than only in the data.
    const connections = related.map(e => {
      const other = e.source === node.id ? e.target : e.source;
      const arrow = e.source === node.id ? '→' : '←';
      return '<div>' + escapeText(e.type) + ' ' + arrow + ' <b>' +
             escapeText(nodeLabel(other)) + '</b>' +
             '<div style="color:var(--muted);font-size:10px">' +
             escapeText(e.authority) + '</div></div>';
    }).join('') || '<div style="color:var(--muted)">Nothing else connects to this yet.</div>';

    if (node.kind === 'actor') {
      body.innerHTML =
        '<h2>' + escapeText(node.label) + '</h2>' +
        '<div class="sub">actor · ' + escapeText(node.source) + ' · ' +
        node.event_count + ' event(s)</div>' +
        (node.resolved
          ? '<div class="field"><b>Council seat</b>' + escapeText(node.role_id) +
            '<div style="color:var(--muted);font-size:10px">' +
            escapeText(node.resolution_basis) + '</div></div>'
          // The residue, stated at the point a viewer would otherwise assume a
          // seat: the Council does not recognize this name, and guessing one
          // would fabricate an attribution.
          : '<div class="unresolved"><b>No Council seat.</b> The registry has no ' +
            'role under this name, and matching one by resemblance would invent ' +
            'an attribution. Attribution stops at the provider\'s name.</div>') +
        '<div class="field"><b>Acted on</b>' + connections + '</div>';
      document.getElementById('panel').classList.add('open');
      return;
    }

    const timeline = (node.timeline || []).map(step =>
      '<div><b>' + escapeText(step.event_type) + '</b>' +
      escapeText(step.title) + '<br>' + escapeText(step.actor) + ' · ' +
      escapeText(step.occurred_at) + '</div>').join('');

    body.innerHTML =
      '<h2>' + escapeText(node.label) + '</h2>' +
      '<div class="sub">' + escapeText(node.entity_type) + ' · ' +
      escapeText(node.source) + ' · ' + node.event_count + ' event(s)</div>' +
      (node.requires_founder
        ? '<div class="field"><b>Status</b><span class="badge executing">awaiting the Founder</span></div>'
        : '') +
      '<div class="field"><b>Timeline</b><div class="timeline">' + timeline + '</div></div>' +
      '<div class="field"><b>Connected</b>' + connections + '</div>' +
      (node.deep_link
        ? '<div class="field"><b>Deep link</b><div class="cmd" id="cmdText">' +
          escapeText(node.deep_link) + '</div>' +
          '<button class="copy" onclick="navigator.clipboard.writeText(' +
          'document.getElementById(\'cmdText\').textContent)">Copy</button></div>'
        : '');
    document.getElementById('panel').classList.add('open');
  }

  window.closePanel = () => document.getElementById('panel').classList.remove('open');
  function openPanel(id) {
    const desk = findDesk(id);
    if (!desk) return;
    const latest = latestEventFor(id);
    const dept = findDept(id);
    const body = document.getElementById('panelBody');
    const skills = (desk.may_instantiate || []);
    const profiles = galaxy.subagent_profiles.filter(p => skills.some(s => p.profile.toLowerCase().includes(s.split(' ')[0].toLowerCase())));
    body.innerHTML =
      '<h2>' + desk.named_role + '</h2>' +
      '<div class="sub">' + desk.operating_owner + ' · ' + desk.id +
      (dept && dept.lead.id !== desk.id ? ' · visual grouping with ' + dept.lead.named_role : '') + '</div>' +
      '<div class="field"><b>Status</b><span class="badge ' + desk.state + '">' + desk.state + '</span></div>' +
      presenceField(id) +
      latestEventField(latest) +
      '<div class="field"><b>Current implementation</b>' + desk.current_implementation + '</div>' +
      '<div class="field"><b>May instantiate (subagent kinds)</b>' +
      '<div class="satellites">' + skills.map(s => '<span class="satellite">' + s + '</span>').join('') + '</div></div>' +
      (desk.active_assignment
        ? '<div class="field"><b>Active assignment</b>' + desk.active_assignment.status.toUpperCase() +
          ' — ' + desk.active_assignment.deliverable + '</div>'
        : '<div class="field"><b>Active assignment</b>None</div>') +
      (desk.recent_outputs && desk.recent_outputs.length
        ? '<div class="field"><b>Recent outputs</b>' + desk.recent_outputs.map(o => '<div>' + o.output + '</div>').join('') + '</div>'
        : '') +
      '<div class="field"><b>Next command</b><div class="cmd" id="cmdText">' + nextCommandFor(desk) + '</div>' +
      '<button class="copy" onclick="navigator.clipboard.writeText(document.getElementById(\'cmdText\').textContent)">Copy</button></div>';
    document.getElementById('panel').classList.add('open');
  }

  window.openLumiaionDialogue = () => {
    activeRole = null; activeDept = null;
    renderBreadcrumb(); updateLabelVisibility();
    const body = document.getElementById('panelBody');
    body.innerHTML =
      '<h2>LUMIAION</h2>' +
      '<div class="sub">Orchestration · formulate an intention</div>' +
      '<div class="field"><b>Your intention</b><textarea id="intentBox" placeholder="e.g. Prepare a coherence report for the Founder"></textarea></div>' +
      '<button class="primary" onclick="window.previewIntention()">Preview mission proposal</button>' +
      '<div id="intentPreview"></div>';
    document.getElementById('panel').classList.add('open');
  };
  window.previewIntention = () => {
    const text = (document.getElementById('intentBox').value || 'your intention').trim();
    document.getElementById('intentPreview').innerHTML =
      '<div class="demo-flag">DEMONSTRATION — no real routing or execution happens here.</div>' +
      '<div class="field"><b>Objective (mock)</b>' + text + '</div>' +
      '<div class="field"><b>Departments concerned (mock)</b>Depends on intention — not yet routed</div>' +
      '<div class="field"><b>Steps (mock)</b>Clarify → assign → execute → synthesize → Founder review</div>' +
      '<div class="field"><b>Deliverables (mock)</b>One reviewable proposal packet</div>' +
      '<div class="field"><b>Limits / decisions needed</b>Real routing requires `ap.py council open/assign/run`</div>';
  };

  // ---------------------------------------------------------------------
  // The Vault panel -- the same knowledge summary office_spatial.py's
  // central Brain node shows, so both views agree on what "the vault" is.
  // ---------------------------------------------------------------------
  function openVaultPanel() {
    activeRole = null; activeDept = null;
    applyFocus('VAULT');
    pushThought('vault', 'VAULT');
    renderBreadcrumb(); updateLabelVisibility();
    const brain = VIEW.brain;
    document.getElementById('panelBody').innerHTML =
      '<h2>Alpha Proxima Vault</h2>' +
      '<div class="sub">The Foundation\'s knowledge, read-only -- shared by every view</div>' +
      '<div class="brain-stats">' +
      '<div><b>' + brain.note_count + '</b>notes</div>' +
      '<div><b>' + brain.domain_count + '</b>domains</div>' +
      '<div><b>' + Math.round(brain.connectedness * 100) + '%</b>connected</div>' +
      '<div><b>' + brain.coherence_defects + '</b>coherence defects</div>' +
      '<div><b>' + brain.knowledge_nodes + '</b>knowledge nodes</div>' +
      '<div><b>' + brain.knowledge_findings + '</b>findings</div>' +
      '</div>' +
      '<div class="field"><b>Truth Kernel health</b>' + esc(brain.health_status) + '</div>' +
      '<button class="primary" onclick="window.openVirtualBrain()">Open memory brain</button>' +
      '<div class="field"><b>Next command</b><div class="cmd" id="cmdText">ap.py app check --max-defects 0</div>' +
      '<button class="copy" onclick="navigator.clipboard.writeText(document.getElementById(\'cmdText\').textContent)">Copy</button></div>';
    document.getElementById('panel').classList.add('open');
  }

  // The Council's brain is intentionally a projection, never a replacement
  // ledger or a second Vault. It shows source metadata only and routes a
  // selected document back through the parent application's guarded reader.
  function sourceNode(path, label) {
    return '<button class="source-link" onclick=\'window.openBrainSource(decodeURIComponent("' + encodeURIComponent(String(path || '')) + '"))\'>' + esc(label || path) + '</button>';
  }
  window.openBrainSource = (path) => {
    if (!path) return;
    window.parent.postMessage({type: 'open-note', path}, window.location.origin);
  };
  window.openVirtualBrain = (category) => {
    const brain = virtualBrain;
    const body = document.getElementById('panelBody');
    const nodes = category ? brain.nodes.filter(node => node.category === category) : [];
    const coverage = brain.source.coverage_complete
      ? 'Vault coverage complete for this projection.'
      : brain.source.unavailable_count + ' iCloud note(s) are unavailable on this Mac and are not treated as indexed content.';
    if (!category) {
      body.innerHTML =
        '<h2>Node Virtual Brain</h2>' +
        '<div class="sub">Derived, read-only cognitive map · ' + esc(brain.authority) + '</div>' +
        '<div class="brain-stats"><div><b>' + brain.source.full_node_count + '</b>source nodes</div><div><b>' + brain.source.full_relationship_count + '</b>source links</div><div><b>' + brain.nodes.length + '</b>visible nodes</div><div><b>' + brain.links.length + '</b>visible links</div></div>' +
        '<div class="field"><b>Coverage</b>' + esc(coverage) + '</div>' +
        '<div class="field"><b>Workspace</b>' + esc(brain.workspace.message) + '</div>' +
        '<div class="field"><b>Explore by Vault domain</b>' + brain.categories.map(item =>
          '<button class="brain-category" onclick=\'window.openVirtualBrain(decodeURIComponent("' + encodeURIComponent(item.id) + '"))\'><b>' + esc(item.id) + '</b><small>' + item.count + ' represented node(s)</small></button>').join('') + '</div>' +
        (brain.truncated ? '<div class="demo-flag">This mobile view intentionally limits the spatial field. It preserves the full source counts and never implies omitted notes are absent.</div>' : '');
    } else {
      body.innerHTML =
        '<h2>' + esc(category) + '</h2>' +
        '<div class="sub">' + nodes.length + ' represented node(s) · metadata only</div>' +
        '<button class="copy" onclick="window.openVirtualBrain()">← All memory domains</button>' +
        nodes.map(node => '<button class="node-card" onclick=\'window.openBrainNode(decodeURIComponent("' + encodeURIComponent(node.id) + '"))\'><b>' + esc(node.title) + '</b><small>' + esc(node.type) + ' · ' + esc(node.status) + ' · ' + esc(node.path) + '</small></button>').join('');
    }
    document.getElementById('panel').classList.add('open');
  };
  window.openBrainNode = (id) => {
    const node = virtualBrain.nodes.find(item => item.id === id);
    if (!node) return;
    const localLinks = virtualBrain.links.filter(link => link.source === id || link.target === id);
    document.getElementById('panelBody').innerHTML =
      '<h2>' + esc(node.title) + '</h2>' +
      '<div class="sub">Knowledge node · source metadata</div>' +
      '<div class="field"><b>Canonical source</b>' + sourceNode(node.path, node.path) + '</div>' +
      '<div class="field"><b>Type / status</b>' + esc(node.type) + ' · ' + esc(node.status) + '</div>' +
      '<div class="field"><b>Owner</b>' + esc(node.owner) + '</div>' +
      '<div class="field"><b>Identity</b>' + esc(node.identity_stability) + ' · ' + node.finding_count + ' validation finding(s)</div>' +
      '<div class="field"><b>Tags</b><div class="satellites">' + (node.tags.length ? node.tags.map(tag => '<span class="satellite">' + esc(tag) + '</span>').join('') : '<span class="sub">No indexed tags</span>') + '</div></div>' +
      '<div class="field"><b>Visible relationships</b>' + localLinks.length + ' · derived from the Truth Kernel</div>' +
      '<button class="copy" onclick=\'window.openVirtualBrain(decodeURIComponent("' + encodeURIComponent(node.category) + '"))\'>← Back to domain</button>';
    document.getElementById('panel').classList.add('open');
  };
  document.getElementById('brainBtn').onclick = () => window.openVirtualBrain();

  // ---------------------------------------------------------------------
  // Council Sessions logistics panel -- every open session and its
  // assignments, the same ledger `ap.py council dashboard` reads, just
  // surfaced inside this scene instead of a separate console.
  // ---------------------------------------------------------------------
  document.getElementById('sessionsBtn').onclick = () => openSessionsPanel();
  document.getElementById('consoleBtn').onclick = () => openOperationalConsole();
  function openOperationalConsole() {
    activeRole = null; activeDept = null;
    renderBreadcrumb(); updateLabelVisibility();
    const council = VIEW.council;
    const counts = council.counts;
    const active = council.sessions.filter(item => item.state !== 'complete');
    const accountable = active.map(item => {
      const role = findDesk(item.accountable_role);
      return '<div class="session-card ' + esc(item.state) + '">' +
        '<div class="meta">' + esc(item.session_id) + ' · ' + esc(item.state) + '</div>' +
        '<div style="margin:4px 0 6px"><b>' + esc(item.founder_intent) + '</b></div>' +
        '<div class="sub">Accountable: ' + esc(role ? role.named_role : item.accountable_role) + ' · Next: ' + esc(item.next_action) + '</div>' +
        (item.assignments.length ? '<div class="field"><b>Verified delivery receipts</b>' + item.assignments.map(run =>
          '<div class="run"><span class="badge state">' + esc(run.status) + '</span> ' + esc(run.id) + ' · ' + esc(run.deliverable) +
          (run.output ? '<br><span class="sub">' + esc(run.output) + '</span>' : '') + '</div>').join('') + '</div>' : '') +
      '</div>';
    }).join('') || '<p class="sub">No active operational sessions.</p>';
    document.getElementById('panelBody').innerHTML =
      '<h2>Council Operations</h2>' +
      '<div class="sub">Local operating console · canonical Council state</div>' +
      '<div class="brain-stats"><div><b>' + counts.active + '</b>active</div><div><b>' + counts.founder_review + '</b>Founder review</div><div><b>' + counts.blocked + '</b>blocked</div><div><b>' + counts.total + '</b>total sessions</div></div>' +
      '<div class="next field"><b>System next action</b>' + esc(council.next_action) + '</div>' +
      '<div class="field"><b>Accountability and delivery</b>' + accountable + '</div>' +
      '<div class="demo-flag">This is the local operational read model. It makes work and receipts visible; opening, assigning, and approving remain explicit Council Kernel actions.</div>';
    document.getElementById('panel').classList.add('open');
  }
  function openSessionsPanel() {
    activeRole = null; activeDept = null;
    applyFocus(null);
    pushThought('sessions', 'SESSIONS');
    renderBreadcrumb(); updateLabelVisibility();
    const council = VIEW.council;
    const body = document.getElementById('panelBody');
    const counts = council.counts;
    const cards = council.sessions.length
      ? council.sessions.map(sessionCard).join('')
      : '<p class="sub">No Council sessions yet.</p>';
    body.innerHTML =
      '<h2>Council Sessions</h2>' +
      '<div class="sub">' + counts.active + ' active · ' + counts.founder_review + ' need Founder · ' +
      counts.blocked + ' blocked · ' + counts.total + ' total</div>' +
      '<div class="field"><b>Next action</b>' + council.next_action + '</div>' +
      cards;
    document.getElementById('panel').classList.add('open');
  }
  function roleLabel(id) {
    const d = findDesk(id);
    return d ? d.named_role : id;
  }
  function sessionCard(item) {
    const runs = item.assignments.map(run =>
      '<div class="run"><span class="badge state">' + run.status + '</span> ' +
      roleLabel(run.role) + ' (' + run.kind + ')<br>' + run.deliverable +
      (run.output ? '<br><span class="sub">' + run.output + '</span>' : '') + '</div>'
    ).join('') || '<div class="run sub">No assignments yet.</div>';
    return '<div class="session-card">' +
      '<div class="meta">' + item.session_id + ' · Class ' + item.decision_class + ' · ' + item.state.toUpperCase() + '</div>' +
      '<div style="margin:4px 0 6px"><b>' + item.founder_intent + '</b></div>' +
      '<div class="sub">Accountable: ' + roleLabel(item.accountable_role) + '</div>' +
      runs +
      '</div>';
  }

  // ---------------------------------------------------------------------
  // search
  // ---------------------------------------------------------------------
  const allDesks = [galaxy.center]
    .concat(galaxy.inner_circle.filter(s => !s.proposed).map(s => s.desk))
    .concat(galaxy.council.flatMap(c => [c.lead].concat(c.constellation)))
    .concat(galaxy.unassigned);
  const searchInput = document.getElementById('search');
  const searchResults = document.getElementById('searchResults');
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) { searchResults.classList.remove('shown'); return; }
    const matches = allDesks.filter(d =>
      d.named_role.toLowerCase().includes(q) ||
      (d.may_instantiate || []).some(s => s.toLowerCase().includes(q))
    ).slice(0, 8);
    searchResults.innerHTML = matches.map(d =>
      '<div tabindex="0" role="option" onclick="window.__pick(\'' + d.id + '\')" ' +
      'onkeydown="if(event.key===\'Enter\')window.__pick(\'' + d.id + '\')">' + d.named_role + '</div>').join('') ||
      '<div>No matches</div>';
    searchResults.classList.add('shown');
  });
  window.__pick = (id) => { selectRole(id); searchResults.classList.remove('shown'); searchInput.value = ''; };

  // ---------------------------------------------------------------------
  // accessible keyboard list (visually hidden, always present)
  // ---------------------------------------------------------------------
  const a11y = document.getElementById('a11yList');
  a11y.innerHTML = allDesks.map(d =>
    '<button onclick="window.__pick(\'' + d.id + '\')">' + d.named_role + ' — ' + d.operating_owner + '</button>').join('');

  renderBreadcrumb();
})();
</script>
</body>
</html>
